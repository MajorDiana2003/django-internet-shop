{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Блок для динамической смены заголовков страниц -->
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <!-- Подключаем Bootstrap CSS из статики -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<div class="container-fluid">
    <div class="row" style="display: flex; flex-wrap: nowrap;">
        <!-- Включаем подшаблон меню (Задание 3) -->
        {% include 'includes/menu.html' %}

        <!-- Основной контент страницы -->
        <main class="text-center" style="flex-grow: 1; padding: 3rem 2rem; width: 100%; overflow-x: hidden;">
            {% block content %}
            <!-- Здесь будет уникальное содержимое каждой страницы -->
            {% endblock %}
        </main>
    </div>
</div>
</body>
</html>
