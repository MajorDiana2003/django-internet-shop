{% extends 'base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container text-center" style="max-width: 500px; margin-right: auto; margin-left: auto; padding-top: 3rem;">
    <div class="card border-danger p-4" style="padding: 1.5rem; border: 1px solid #dc3545; border-radius: .375rem; background-color: #fff;">
        <h2 class="text-danger mb-3" style="color: #dc3545; margin-top: 0;">Удаление статьи</h2>
        <p class="lead mb-4" style="font-size: 1.25rem; font-weight: 300;">Вы действительно хотите безвозвратно удалить публикацию <strong>«{{ object.title }}»</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3" style="display: flex; justify-content: center; gap: 15px;">
                <button type="submit" class="btn btn-danger" style="padding: .375rem .75rem; background-color: #dc3545; color: #fff; border: none; border-radius: .25rem;">Да, удалить</button>
                <a href="{% url 'blog:detail' object.slug %}" class="btn btn-secondary" style="padding: .375rem .75rem; background-color: #6c757d; color: #fff; text-decoration: none; border-radius: .25rem;">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
