{% extends 'base.html' %}

{% block title %}Контакты{% endblock %}

{% block content %}
<h1 class="display-4 text-center mb-4">Обратная связь</h1>

<div class="row justify-content-center text-start" style="display: flex; justify-content: center; flex-wrap: wrap;">
    <!-- Левая колонка: форма -->
    <div class="col-md-5 p-4 border rounded bg-light" style="width: 41.66666667%; padding: 1.5rem; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: .375rem; margin-right: 1rem;">
        <h4 class="mb-3">Напишите нам</h4>
        <form method="POST">
            {% csrf_token %} <!-- Защита по критериям -->
            <div class="mb-3" style="margin-bottom: 1rem;">
                <label class="form-label" style="display: inline-block; margin-bottom: .5rem;">Имя</label>
                <input type="text" name="name" class="form-control" style="display: block; width: 100%; padding: .375rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" required>
            </div>
            <div class="mb-3" style="margin-bottom: 1rem;">
                <label class="form-label" style="display: inline-block; margin-bottom: .5rem;">Телефон</label>
                <input type="text" name="phone" class="form-control" style="display: block; width: 100%; padding: .375rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" required>
            </div>
            <div class="mb-3" style="margin-bottom: 1rem;">
                <label class="form-label" style="display: inline-block; margin-bottom: .5rem;">Сообщение</label>
                <textarea name="message" class="form-control" rows="4" style="display: block; width: 100%; padding: .375rem .75rem; border: 1px solid #ced4da; border-radius: .25rem;" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="width: 100%;">Отправить данные</button>
        </form>
    </div>

    <!-- Правая колонка: данные из БД -->
    <div class="col-md-4 p-4 border rounded bg-light" style="width: 33.33333333%; padding: 1.5rem; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: .375rem;">
        <h4 class="mb-3">Наши контакты</h4>
        <ul class="list-unstyled" style="padding-left: 0; list-style: none;">
            <li class="mb-2"><strong>Телефон:</strong> {{ contact.phone }}</li>
            <li class="mb-2"><strong>Email:</strong> {{ contact.email }}</li>
            <li class="mb-2"><strong>Адрес:</strong> {{ contact.address }}</li>
        </ul>
    </div>
</div>
{% endblock %}
