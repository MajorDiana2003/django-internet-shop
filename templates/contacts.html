{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #212529; padding: 1rem; flex: 0 0 220px; width: 220px; }
        .row { display: flex; flex-wrap: nowrap; margin-right: -.75rem; margin-left: -.75rem; }
        main { flex-grow: 1; padding: 3rem 2rem; width: 100%; overflow-x: hidden; }
        .nav { display: flex; flex-direction: column; padding-left: 0; margin-bottom: 0; list-style: none; }
        .nav-link { display: block; padding: .5rem 1rem; color: #8a8d93; text-decoration: none; }
        .nav-link.active { color: #fff!important; background-color: #0d6efd; border-radius: .375rem; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <nav class="sidebar">
            <div class="d-flex align-items-center mb-3 text-white text-decoration-none">
                <span class="fs-4 fw-bold">Магазин</span>
            </div>
            <hr class="text-secondary" style="border-top: 1px solid white; opacity: 0.25;">
            <ul class="nav">
                <li><a href="{% url 'catalog:home' %}" class="nav-link">Главная</a></li>
                <li><a href="{% url 'catalog:contacts' %}" class="nav-link active">Контакты</a></li>
            </ul>
        </nav>

        <!-- Контент -->
        <main>
            <h1 class="display-4 text-center mb-5">Обратная связь</h1>
            <div class="row justify-content-center text-start" style="flex-wrap: wrap; gap: 30px;">
                <div class="col-md-5 p-4 border rounded bg-light">
                    <!-- Запрос отправляется на этот же адрес методом POST -->
                    <form method="POST">
                        {% csrf_token %}<!-- Обязательный токен защиты Django  -->
                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" name="name" class="form-control" secure required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Телефон</label>
                            <input type="text" name="phone" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сообщение</label>
                            <textarea name="message" class="form-control" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Отправить данные</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
