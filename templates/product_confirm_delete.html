{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1>Удалить товар «{{ object.name }}»?</h1>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить</button>
        <a class="btn btn-secondary"
           href="{% url 'catalog:product_detail' object.pk %}">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
