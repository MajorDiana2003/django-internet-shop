{% extends 'base.html' %}

{% block title %}Добавление товара{% endblock %}

{% block content %}
<div class="container text-start" style="text-align: left !important; max-width: 600px; margin-right: auto; margin-left: auto; padding-right: .75rem; padding-left: .75rem;">
    <h1 class="mb-4 text-center" style="text-align: center !important; margin-bottom: 1.5rem;">Добавить новый товар</h1>

    <form method="post" enctype="multipart/form-data" class="border p-4 rounded bg-light" style="padding: 1.5rem; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: .375rem;">
        {% csrf_token %} <!-- Защита сессии по ТЗ -->

        {% for field in form %}
            <div class="mb-3" style="margin-bottom: 1rem;">
                <label class="form-label" style="display: inline-block; margin-bottom: .5rem;" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1" style="color: #dc3545; font-size: .875em; margin-top: .25rem;">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-success w-100" style="display: block; width: 100%; padding: .375rem .75rem; background-color: #198754; color: #fff; border: none; border-radius: .25rem; font-size: 1rem; margin-top: 1.5rem;">Добавить в базу данных</button>
    </form>
</div>
{% endblock %}
